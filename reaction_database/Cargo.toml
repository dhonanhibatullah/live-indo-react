[package]
name = "reaction_database"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
url = "2"
percent-encoding = "2"
