[package]
name = "master_database"
version = "0.1.0-dev.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
dotenvy = "0.15"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "chrono", "runtime-tokio", "tls-rustls-ring-webpki", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
sha2 = "0.11"
url = "2"
percent-encoding = "2"
