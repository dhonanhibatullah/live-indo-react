[workspace]
members = ["crates/*", "proto/gen/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
serde_json = "1"
time = "0.3"
uuid = "1"
