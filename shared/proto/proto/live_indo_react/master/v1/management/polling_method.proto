syntax = "proto3";

package live_indo_react.master.v1;

import "live_indo_react/master/v1/common/models.proto";

service ManagementPollingMethodService {
  rpc UpdatePollingMethod(UpdatePollingMethodRequest) returns (UpdatePollingMethodResponse);
  rpc DeletePollingMethod(DeletePollingMethodRequest) returns (DeletePollingMethodResponse);
}

message UpdatePollingMethodRequest {
  int64 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional bool is_active = 4;
}

message UpdatePollingMethodResponse {
  live_indo_react.master.v1.PollingMethod polling_method = 1;
}

message DeletePollingMethodRequest {
  int64 id = 1;
}

message DeletePollingMethodResponse {}
