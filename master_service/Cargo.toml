[package]
name = "master_service"
version = "0.1.0-dev.1"
edition = "2024"
autotests = false

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15"
flate2 = "1"
httpdate = "1"
maxminddb = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tar = "0.4"
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
live-indo-proto = { path = "../shared/proto/gen/rust" }
moka = { version = "0.12", default-features = false, features = ["sync"] }
pgdt = { path = "../shared/crates/pgdt", features = ["chrono"] }
prost = "0.14"
prost-types = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
